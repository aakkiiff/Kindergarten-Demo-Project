server {
    listen 80;
    server_name localhost;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Student Service
    location /students {
        proxy_pass http://studentservice:5001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Teacher Service
    location /teachers {
        proxy_pass http://teacherservice:5002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Employee Service
    location /employees {
        proxy_pass http://employeeservice:5003;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Profile Service
    location /photos {
        proxy_pass http://profileservice:5004;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://profileservice:5004;
    }

    location /ready {
        proxy_pass http://profileservice:5004;
    }
}