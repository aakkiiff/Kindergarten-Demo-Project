
upstream studentservice {
    server studentservice:5001;
}

upstream teacherservice {
    server teacherservice:5002;
}

upstream employeeservice {
    server employeeservice:5003;
}

upstream profileservice {
    server profileservice:5004;
}

upstream object-storage {
    server object-storage:9000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;

    location /api/students/ {
        proxy_pass http://studentservice/;
    }

    location /api/teachers/ {
        proxy_pass http://teacherservice/;
    }

    location /api/employees/ {
        proxy_pass http://employeeservice/;
    }

    location /api/profile/ {
        proxy_pass http://profileservice/;
    }

    location /media/ {
        # Preserve the host and port used to sign thumbnail URLs.
        proxy_set_header Host object-storage:9000;
        proxy_pass http://object-storage/;
    }

    location / {
        proxy_pass http://frontend;
    }
}